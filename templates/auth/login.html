{% extends 'base.html' %}


{% block title %}
    Login
{% endblock %}


{% block conteudo %}
 
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth/login.css') }}">


<div class="page-center">
    <div class="container">

        <div class="logo">
            <img src="{{ url_for('static', filename='img/geral/ifnexus-logobranca.svg') }}" alt="IFNexus Logo">
        </div>

        <div class="botoes">
            <p>Entre com sua conta e explore os projetos do IFRN.</p>
            <form action="{{ url_for('auth.login') }}" method="post">
                <div class="input-group">
                    <input type="text" name="email" placeholder="Email">
                    <span class="icon"></span>
                </div>
                <div class="input-group">
                    <input type="password" name="senha" placeholder="Senha">
                    <span class="icon"></span>
                </div>
                <button>Entrar</button>
            </form>
            <div class="loginsuap">
                <a id="botao-login-suap" class="btn-suap" href="{{ url_for('auth.login_suap') }}">Entrar com o <strong>SUAP</strong></a>
                <p id="suap-feedback" class="suap-feedback" role="status" aria-live="polite"></p>
            </div>
        </div>
    </div>


    <div class="subcontainer">
        <p>
            Ainda não tem uma conta?
            <a href="{{ url_for('auth.register') }}">Cadastre-se</a>
        </p>
    </div>
</div>

<script>
(() => {
    const config = {{ suap_config|tojson }};
    const button = document.getElementById('botao-login-suap');
    const feedback = document.getElementById('suap-feedback');
    const stateKey = 'ifnexus_suap_oauth_state';

    function setFeedback(message, isError = false) {
        feedback.textContent = message;
        feedback.classList.toggle('is-error', isError);
    }

    function randomState() {
        const bytes = crypto.getRandomValues(new Uint8Array(24));
        return Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
    }

    button.addEventListener('click', event => {
        event.preventDefault();
        if (!config.client_id) {
            setFeedback('O login SUAP ainda não foi configurado neste ambiente.', true);
            return;
        }

        const state = randomState();
        sessionStorage.setItem(stateKey, state);
        const params = new URLSearchParams({
            response_type: 'token',
            client_id: config.client_id,
            scope: config.scope,
            redirect_uri: config.redirect_uri,
            state,
        });
        window.location.assign(`${config.base_url}/o/authorize/?${params.toString()}`);
    });

    async function finishSuapLogin() {
        const params = new URLSearchParams(window.location.hash.slice(1));
        if (!params.has('access_token') && !params.has('error')) return;

        window.history.replaceState({}, document.title, window.location.pathname + window.location.search);
        if (params.has('error')) {
            setFeedback('O acesso pelo SUAP foi cancelado ou recusado.', true);
            return;
        }

        const expectedState = sessionStorage.getItem(stateKey);
        const returnedState = params.get('state');
        sessionStorage.removeItem(stateKey);
        if (!expectedState || !returnedState || expectedState !== returnedState) {
            setFeedback('Não foi possível confirmar a origem do login. Tente novamente.', true);
            return;
        }

        setFeedback('Validando sua conta no SUAP...');
        button.setAttribute('aria-disabled', 'true');
        try {
            const response = await fetch(config.process_url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ access_token: params.get('access_token') }),
            });
            const data = await response.json();
            if (!response.ok || !data.success) throw new Error(data.message || 'Falha no login SUAP.');
            window.location.replace(data.redirect || '/');
        } catch (error) {
            setFeedback(error.message || 'Não foi possível concluir o login via SUAP.', true);
            button.removeAttribute('aria-disabled');
        }
    }

    finishSuapLogin();
})();
</script>
{% endblock %}
